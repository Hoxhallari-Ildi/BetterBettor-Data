permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  data-agent:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create output directories
        run: |
          mkdir -p output/home
          mkdir -p output/away

      - name: Load Home Team Data
        run: |
          python scrapers/soccer.py \
            --season "${{ inputs.season }}" \
            --team "${{ inputs.home_team }}" \
            --n-matches "${{ inputs.n_matches }}" \
            --opponent-n-matches "${{ inputs.opponent_n_matches }}" \
            --league "${{ inputs.league }}"

          cp output/*.csv output/home/

      - name: Load Away Team Data
        run: |
          rm -f output/*.csv

          python scrapers/soccer.py \
            --season "${{ inputs.season }}" \
            --team "${{ inputs.away_team }}" \
            --n-matches "${{ inputs.n_matches }}" \
            --opponent-n-matches "${{ inputs.opponent_n_matches }}" \
            --league "${{ inputs.league }}"

          cp output/*.csv output/away/

      - name: Check CSVs were generated
        run: |
          echo "Home team CSVs:"
          ls -lh output/home/*.csv

          echo ""
          echo "Away team CSVs:"
          ls -lh output/away/*.csv

      - name: Create data page
        run: |
          python - <<'PY'
          import csv
          from html import escape
          from pathlib import Path

          output = Path("output")

          teams = [
              ("Baseline - Home Team", output / "home"),
              ("Baseline - Away Team", output / "away"),
          ]

          sections = []

          for label, team_dir in teams:
              team_sections = []

              for csv_file in sorted(team_dir.glob("*.csv")):
                  with csv_file.open(newline="", encoding="utf-8") as f:
                      rows = list(csv.reader(f))

                  if not rows:
                      continue

                  headers = rows[0]
                  data = rows[1:]

                  table = [
                      f"<h3>{escape(csv_file.stem)}</h3>",
                      "<table>",
                      "<thead><tr>",
                      "".join(
                          f"<th>{escape(h)}</th>"
                          for h in headers
                      ),
                      "</tr></thead>",
                      "<tbody>",
                  ]

                  for row in data:
                      table.append(
                          "<tr>"
                          + "".join(
                              f"<td>{escape(cell)}</td>"
                              for cell in row
                          )
                          + "</tr>"
                      )

                  table.extend([
                      "</tbody>",
                      "</table>",
                  ])

                  team_sections.append("\n".join(table))

              sections.append(f"""
                <section>
                  <h2>{escape(label)}</h2>
                  {''.join(team_sections)}
                </section>
              """)

          html = f"""<!doctype html>
          <html>
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>
              {escape("${{ inputs.home_team }}")}
              vs
              {escape("${{ inputs.away_team }}")}
            </title>

            <style>
              body {{
                font-family: Arial, sans-serif;
                margin: 30px;
                background: #f5f5f5;
                color: #222;
              }}

              h1 {{
                margin-bottom: 10px;
              }}

              .match-info {{
                margin-bottom: 40px;
                font-size: 18px;
              }}

              section {{
                margin-bottom: 60px;
              }}

              h2 {{
                margin-top: 40px;
                padding: 15px;
                background: #222;
                color: white;
              }}

              h3 {{
                margin-top: 30px;
              }}

              table {{
                border-collapse: collapse;
                width: 100%;
                background: white;
                margin-bottom: 30px;
                box-shadow: 0 1px 4px rgba(0,0,0,0.1);
              }}

              th, td {{
                border: 1px solid #ddd;
                padding: 8px 12px;
                text-align: left;
              }}

              th {{
                background: #444;
                color: white;
                position: sticky;
                top: 0;
              }}

              tr:nth-child(even) {{
                background: #f9f9f9;
              }}

              .table-container {{
                overflow-x: auto;
              }}
            </style>
          </head>

          <body>
            <h1>
              {escape("${{ inputs.home_team }}")}
              vs
              {escape("${{ inputs.away_team }}")}
            </h1>

            <div class="match-info">
              Season: {escape("${{ inputs.season }}")}
              &nbsp; | &nbsp;
              League: {escape("${{ inputs.league }}")}
            </div>

            {''.join(sections)}

          </body>
          </html>
          """

          (output / "index.html").write_text(
              html,
              encoding="utf-8"
          )
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site to GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: output

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
