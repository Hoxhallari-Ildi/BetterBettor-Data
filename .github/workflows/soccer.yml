      n_matches:
        description: "Number of recent matches"
        required: true
        default: "5"
        type: number

      opponent_n_matches:
        description: "Number of previous opponent matches"
        required: true
        default: "5"
        type: number

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  generate:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create output directory
        run: mkdir -p output

      - name: Load Data
        run: |
          python scrapers/soccer.py \
            --season "${{ inputs.season }}" \
            --team "${{ inputs.team }}" \
            --n-matches "${{ inputs.n_matches }}" \
            --opponent-n-matches "${{ inputs.opponent_n_matches }}"

      - name: Check CSVs were generated
        run: |
          ls -lh output/*.csv

      - name: Create a download page
        run: |
          python - <<'PY'
          from html import escape
          from pathlib import Path

          files = sorted(Path("output").glob("*.csv"))
          links = "\n".join(
              f'<li><a href="{escape(p.name, quote=True)}">{escape(p.name)}</a></li>'
              for p in files
          )
          Path("output/index.html").write_text(
              f"<!doctype html><html><head><meta charset='utf-8'>"
              f"<title>Soccer CSVs</title></head><body>"
              f"<h1>Soccer CSVs</h1><ul>{links}</ul></body></html>",
              encoding="utf-8",
          )
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site to GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: output

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4      
